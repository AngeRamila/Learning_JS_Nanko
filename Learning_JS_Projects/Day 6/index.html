<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">

        <div class="game-card">

            <div class="icon">🎯</div>
            <h1>Guess the Number</h1>

            <p class="description">
                I'm thinking of a number between <strong>1 and 100</strong>.
                Can you guess it?
            </p>
            <div class="input-section">

                <input
                    type="number"
                    id="guessInput"
                    placeholder="Enter your guess"
                    min="1"
                    max="100"
                >

                <button id="guessButton">
                    Guess
                </button>

            </div>
            <p id="message">
                Enter a number to start!    
            </p>

            <div class="stats">

                <div class="stat">
                    <span id="attempts">0</span>
                    <small>Attempts</small>
                </div>

                <div class="stat">
                    <span id="remaining">10</span>
                    <small>Remaining</small>
                </div>

            </div>
             <button id="restartButton" class="restart">
                🔄 New Game
            </button>

        </div>

    </div>
</body>
